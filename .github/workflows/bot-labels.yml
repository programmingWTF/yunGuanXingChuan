# 自动打标签 — 根据修改文件路径自动添加中文标签
# 无需 AI，纯确定性规则，PR 创建/更新时触发

name: 自动打标签

on:
  pull_request:
    types: [opened, synchronize]

# contents: read 用于读取 .github/labeler.yml 配置（checkout 后本地读取，也允许 API 兜底拉取）
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/labeler@v7
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: false
