# 自动化测试 — PR 与 main 变更时运行全部自包含测试（不依赖外部 API / LLM）
# 测试均为自包含用例（conftest.py 提供示例数据，不调用 LLM/网络）；含覆盖率门槛

name: 自动化测试

on:
  pull_request:
    types: [opened, synchronize, reopen]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装中文字体（PDF 导出测试需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 运行测试并检查覆盖率
        run: |
          pytest tests/ -q --cov=src --cov=api --cov-report=term-missing \
            --cov-fail-under=70 --junitxml=test-results.xml

      - name: 汇总测试结果
        if: always()
        run: |
          python - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          root = ET.parse("test-results.xml").getroot()
          tests = int(root.get("tests", 0))
          fails = int(root.get("failures", 0))
          errs = int(root.get("errors", 0))
          passed = tests - fails - errs

          state = "✅ 全部通过" if fails == 0 and errs == 0 else "❌ 存在失败"
          print(f"## 测试结果：{state}")
          print(f"- 用例：**{passed}/{tests}** 通过" +
                (f"，失败 {fails}、错误 {errs}" if fails or errs else ""))
          if fails or errs:
              print()
              print("### 失败用例")
              for tc in root.iter("testcase"):
                  if tc.find("failure") is not None or tc.find("error") is not None:
                      print(f"- `{tc.get('classname')}::{tc.get('name')}`")
          PYEOF